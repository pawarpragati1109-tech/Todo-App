<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Todo App</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand text-white fw-bold" href="#"> ✅ TaskFlow </a>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5">
      <h1 class="text-center mb-4">My Todo App</h1>

      <!-- Add Task Section -->
      <div class="card shadow p-4">
        <div class="row g-2">
          <div class="col-md-8">
            <input
              type="text"
              id="taskInput"
              class="form-control"
              placeholder="Enter your task"
            />
          </div>

          <div class="col-md-2">
            <select id="priority" class="form-select">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="addTaskBtn">Add</button>
          </div>
        </div>
      </div>

      <div class="mt-4 mb-3">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="🔍 Search tasks..."
        />
      </div>

      <!-- Task List -->
      <div class="mt-4">
        <ul class="list-group" id="taskList"></ul>
      </div>
    </div>

    <!-- Edit Modal -->

    <div class="modal fade" id="editModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Task</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="text" id="editInput" class="form-control" />
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" onclick="updateTask()">
              Update
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
